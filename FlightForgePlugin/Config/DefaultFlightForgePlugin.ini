; Keeps assets saved against the old "ueds" module loading after the rename to
; FlightForgeCore (Blueprint parents, GameMode/GameInstance references in maps
; and project settings). If redirects from a plugin config are not picked up in
; your engine version, copy this [CoreRedirects] block into the project's
; Config/DefaultEngine.ini.

[CoreRedirects]
+PackageRedirects=(OldName="/Script/ueds",NewName="/Script/FlightForgeCore",MatchSubstring=false)
+ClassRedirects=(OldName="/Script/ueds.uedsGameModeBase",NewName="/Script/FlightForgeCore.FlightForgeGameModeBase")
+ClassRedirects=(OldName="/Script/ueds.uedsGameInstance",NewName="/Script/FlightForgeCore.FlightForgeGameInstance")
+ClassRedirects=(OldName="/Script/FlightForgeCore.DronePawn",NewName="/Script/FlightForgeCore.RobotPawn")
+ClassRedirects=(OldName="/Script/ueds.DronePawn",NewName="/Script/FlightForgeCore.RobotPawn")
