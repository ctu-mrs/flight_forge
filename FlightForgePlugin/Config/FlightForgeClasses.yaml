# Segmentation class tree. Copy to <project>/Config/FlightForgeClasses.yaml and add rules.
#
# classes: one node per line, path = its place in the tree, id fixed forever (append new ids, never
#          renumber). Sensors emit the leaf id; get_class_map gives every node's parent, so a consumer
#          collapses to whatever level it needs (tree, vegetation, ...). Ids must stay in 1..255 while
#          the legacy stencil carries them.
# roots:   content folders whose sub-folders spell the class path: /Game/Assets/Vegetation/Tree/Conifer/SM_x
#          -> vegetation/tree/conifer (case-insensitive; an unregistered sub-folder falls back to its parent).
# rules:   explicit matches, first wins, checked before the folder derivation: path (asset path wildcard),
#          class_name (actor class wildcard), tag (actor tag). Marketplace packs are mapped here instead
#          of being moved.

classes:
  - {id: 1,  path: terrain}
  - {id: 2,  path: terrain/road}
  - {id: 3,  path: terrain/sidewalk}
  - {id: 4,  path: terrain/grass}
